<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تفاصيل الفيلم</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{
background:#f3f6ff;
font-family:'Cairo',sans-serif;
}

.details-container{
max-width:1100px;
margin:auto;
padding:40px;
}

.movie-top{
display:flex;
gap:40px;
align-items:flex-start;
margin-bottom:40px;
}

.poster{
width:280px;
border-radius:12px;
box-shadow:0 6px 20px rgba(0,0,0,0.2);
}

.info h1{
color:#5e4bdf;
margin-bottom:10px;
}

.summary{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
margin-top:10px;
line-height:1.7;
}

.booking-box{
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
margin-top:30px;
}

select{
padding:8px 12px;
border-radius:8px;
border:1px solid #ccc;
margin-bottom:15px;
}

.times button{
margin:6px;
padding:8px 16px;
border:none;
background:#6a5acd;
color:white;
border-radius:6px;
cursor:pointer;
}

.times button:hover{
background:#523ac7;
}

.seats{
display:grid;
grid-template-columns:repeat(8,40px);
gap:10px;
justify-content:center;
margin-top:20px;
}

.seat{
width:40px;
height:40px;
background:#ddd;
border-radius:6px;
cursor:pointer;
}

.seat.selected{
background:#6a5acd;
}

.seat.taken{
background:#444;
cursor:not-allowed;
}

.book-btn{
margin-top:25px;
padding:12px 30px;
background:#ff7a18;
border:none;
color:white;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="details-container">

<div class="movie-top">

<img id="poster" class="poster">

<div class="info">

<h1 id="title"></h1>

<p><b>اللغة:</b> <span id="lang"></span></p>
<p><b>سنة الإصدار:</b> <span id="year"></span></p>

<div class="summary" id="description"></div>

</div>

</div>

<div class="booking-box">

<h2>اختيار موعد العرض</h2>

<label>التاريخ:</label>

<br>

<select id="dateSelect"></select>

<div class="times" id="times"></div>

<h2 style="margin-top:25px;">اختيار المقاعد</h2>

<div class="seats" id="seats"></div>

<button class="book-btn" onclick="confirmBooking()">
تأكيد الحجز
</button>

</div>

</div>

<script src="js/details.js"></script>

</body>

</html>
