<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<title>إتمام الحجز</title>

<link rel="stylesheet" href="css/style.css">

<style>

.payment-container{

max-width:600px;

margin:100px auto;

background:white;

padding:40px;

border-radius:12px;

box-shadow:0 6px 20px rgba(0,0,0,0.15);

text-align:center;

}

.payment-container h1{

color:#5e4bdf;

margin-bottom:20px;

}

.info{

margin:10px 0;

font-size:16px;

}

.price{

font-size:22px;

color:#ff7a18;

margin-top:20px;

font-weight:bold;

}

.pay-btn{

margin-top:30px;

padding:12px 35px;

border:none;

background:#6a5acd;

color:white;

border-radius:8px;

font-size:16px;

cursor:pointer;

}

.pay-btn:hover{

background:#523ac7;

}

</style>

</head>

<body>

<div class="payment-container">

<h1>تفاصيل الحجز</h1>

<div class="info">الفيلم: <span id="movie"></span></div>

<div class="info">التاريخ: <span id="date"></span></div>

<div class="info">الوقت: <span id="time"></span></div>

<div class="info">المقاعد: <span id="seats"></span></div>

<div class="price">السعر الإجمالي: <span id="price"></span> ريال</div>

<button class="pay-btn" onclick="payNow()">
ادفع الآن
</button>

</div>

<script>

const data = JSON.parse(localStorage.getItem("bookingData"));

document.getElementById("movie").textContent = data.movie;

document.getElementById("date").textContent = data.date;

document.getElementById("time").textContent = data.time;

document.getElementById("seats").textContent = data.seats.join(", ");

document.getElementById("price").textContent = data.price;

function payNow(){

alert("تم الدفع بنجاح 🎉");

localStorage.removeItem("bookingData");

window.location.href="index.html";

}

</script>

</body>

</html>
