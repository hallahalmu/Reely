<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<title>تسجيل الدخول</title>

<link rel="stylesheet" href="css/style.css">

<style>

.login-box{
width:350px;
margin:120px auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 4px 15px rgba(0,0,0,0.15);
text-align:center;
}

.login-box input{
width:100%;
padding:10px;
margin:10px 0;
border-radius:6px;
border:1px solid #ccc;
}

.login-box button{
padding:10px 20px;
background:#6a5acd;
border:none;
color:white;
border-radius:8px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="login-box">

<h2>تسجيل الدخول</h2>

<input id="username" placeholder="اسم المستخدم">

<input id="password" type="password" placeholder="كلمة المرور">

<button onclick="login()">دخول</button>

</div>

<script>

function login(){

localStorage.setItem("loggedIn","true");

window.location.href="index.html";

}

</script>

</body>

</html>
